<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUNDAN SMS PANEL</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;background:#0b1220;color:white;font-family:Arial,sans-serif;}
        .container{max-width:950px;margin:auto;padding:18px}
        h1{color:#ffc107;text-align:center}
        .card{background:#172337;padding:18px;border-radius:12px;margin:15px 0;border:1px solid #30435c;}
        input,textarea,select{width:100%;padding:13px;margin:8px 0;border:1px solid #45566f;border-radius:7px;background:#0c1729;color:white;}
        button{background:#ffc107;color:#111;border:0;padding:12px 18px;border-radius:7px;font-weight:bold;cursor:pointer;margin:5px 0;}
        button.secondary{background:#34465e;color:white}
        .hidden{display:none}
        .stats{display:flex;gap:10px;flex-wrap:wrap}
        .stat{flex:1;min-width:110px;background:#263750;padding:15px;border-radius:9px;text-align:center}
        table{width:100%;border-collapse:collapse}
        th,td{padding:10px;border-bottom:1px solid #45566f;text-align:left}
        .small{font-size:12px;color:#aabbd0}
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div id="login" class="card">
            <h1>KUNDAN SMS PANEL</h1>
            <h3>Admin Login</h3>
            <input id="username" placeholder="Username">
            <input id="password" type="password" placeholder="Password">
            <button onclick="loginUser()">Login</button>
            <p id="error" style="color:#ff7777"></p>
            <p class="small">Demo login: admin / admin123</p>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">
            <h1>KUNDAN SMS PANEL</h1>
            <div class="stats">
                <div class="stat">Total SMS<h2 id="total">0</h2></div>
                <div class="stat">History<h2 id="historyCount">0</h2></div>
                <div class="stat">Sender ID<h3>KL-LOTTERY</h3></div>
            </div>

            <div class="card">
                <h3>Send Credit Alert SMS (Fast2SMS)</h3>
                <label>Sender ID Name</label>
                <input id="senderIdInput" value="KL-LOTTERY" placeholder="e.g. KL-LOTTERY">
                <label>SMS Type</label>
                <select id="type" onchange="changeType()">
                    <option value="single">Single SMS</option>
                    <option value="bulk">Bulk SMS</option>
                </select>
                <div id="singleBox">
                    <label>Mobile Number</label>
                    <input id="mobile" placeholder="10 digit mobile number" maxlength="10">
                </div>
                <div id="bulkBox" class="hidden">
                    <label>Mobile Numbers (comma separated)</label>
                    <input id="numbers" placeholder="9876543210,9876543211">
                </div>
                <label>Amount (₹)</label>
                <input id="smsAmount" placeholder="e.g. 5000" type="number">
                <label>Additional Note / Details (Optional)</label>
                <textarea id="message" rows="3" placeholder="e.g. Prize Won / Deposit Success"></textarea>
                <button onclick="sendRealSMS()">Send Real Credit Alert via Fast2SMS</button>
                <p id="status" class="small"></p>
            </div>

            <div class="card">
                <h3>SMS History</h3>
                <button class="secondary" onclick="downloadCSV()">Download History</button>
                <button class="secondary" onclick="clearHistory()">Clear History</button>
                <div style="overflow-x:auto">
                    <table>
                        <thead>
                            <tr>
                                <th>Number</th>
                                <th>Message</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="history"></tbody>
                    </table>
                </div>
            </div>
            <button class="secondary" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem("kundan_sms_history") || "[]");

        function loginUser(){
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            if(u === "admin" && p === "admin123"){
                document.getElementById("login").classList.add("hidden");
                document.getElementById("dashboard").classList.remove("hidden");
                render();
            } else {
                document.getElementById("error").innerText = "Wrong username or password";
            }
        }

        function logout(){
            document.getElementById("dashboard").classList.add("hidden");
            document.getElementById("login").classList.remove("hidden");
        }

        function changeType(){
            const type = document.getElementById("type").value;
            document.getElementById("singleBox").classList.toggle("hidden", type === "bulk");
            document.getElementById("bulkBox").classList.toggle("hidden", type === "single");
        }

        async function sendRealSMS() {
            const type = document.getElementById("type").value;
            const amount = document.getElementById("smsAmount").value.trim();
            const customNote = document.getElementById("message").value.trim();
            const senderId = document.getElementById("senderIdInput").value.trim() || "KL-LOTTERY";

            if (!amount) {
                alert("Please enter the amount");
                return;
            }

            const finalMessage = `🟢 ALERT: Rs.${amount} credited successfully. ${customNote ? customNote : 'Ref: KL-LOTTERY-TXN'}. Thank you!`;
            let numbersString = "";
            let numsArray = [];

            if (type === "single") {
                let n = document.getElementById("mobile").value.trim();
                if (!/^[6-9][0-9]{9}$/.test(n)) {
                    alert("Enter a valid Indian mobile number");
                    return;
                }
                numbersString = n;
                numsArray = [n];
            } else {
                numbersString = document.getElementById("numbers").value.trim();
                if (!numbersString) {
                    alert("Please enter mobile numbers");
                    return;
                }
                numsArray = numbersString.split(",").map(n => n.trim()).filter(Boolean);
            }

            document.getElementById("status").innerText = "Sending via Fast2SMS...";

            try {
                // CORS बाईपास प्रॉक्सी के साथ API कॉल
                const targetUrl = encodeURIComponent("https://www.fast2sms.com/dev/bulkV2");
                const response = await fetch("https://corsproxy.io/?url=" + targetUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "authorization": "IsvmYgDlzHWWAkLDI8p7i4SbVIVPdH37yn272j7GdHluzgWyljjnVV4IHsZX57VLscW7nCsyhwVIotMT"
                    },
                    body: JSON.stringify({
                        route: "v3",
                        sender_id: senderId,
                        message: finalMessage,
                        language: "english",
                        flash: 0,
                        numbers: numbersString
                    })
                });

                const data = await response.json();

                if (response.ok && data.return === true) {
                    document.getElementById("status").innerText = "Alert sent successfully with ID: " + senderId;
                    numsArray.forEach(targetNumber => {
                        records.unshift({
                            number: targetNumber,
                            message: finalMessage,
                            status: "Sent via Fast2SMS (" + senderId + ")",
                            date: new Date().toLocaleString()
                        });
                    });
                    localStorage.setItem("kundan_sms_history", JSON.stringify(records));
                    render();
                } else {
                    alert("Fast2SMS Error: " + (data.message || "Failed to send"));
                    document.getElementById("status").innerText = "Failed";
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Network or API connection error.");
                document.getElementById("status").innerText = "";
            }
        }

        function render(){
            document.getElementById("total").innerText = records.length;
            document.getElementById("historyCount").innerText = records.length;
            document.getElementById("history").innerHTML = records.map(r => `
                <tr>
                    <td>${escapeHTML(r.number)}</td>
                    <td>${escapeHTML(r.message)}</td>
                    <td>${escapeHTML(r.status)}</td>
                    <td>${escapeHTML(r.date)}</td>
                </tr>
            `).join("");
        }

        function escapeHTML(s){
            return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
        }

        function downloadCSV(){
            let csv = "Number,Message,Status,Date\n";
            records.forEach(r => {
                csv += [r.number, r.message, r.status, r.date]
                    .map(v => '"' + String(v).replace(/"/g, '""') + '"')
                    .join(",") + "\n";
            });
            let blob = new Blob([csv], {type: "text/csv"});
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "kundan_sms_history.csv";
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function clearHistory(){
            if(confirm("Delete all history?")){
                records = [];
                localStorage.removeItem("kundan_sms_history");
                render();
            }
        }
    </script>
</body>
</html>
